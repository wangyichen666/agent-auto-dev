[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dtcoder-agentic-dev"
version = "0.1.0"
description = "可恢复、可扩展的 Issue 研发工作流"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["click>=8.1", "PyYAML>=6", "tabulate>=0.9"]

[project.optional-dependencies]
claude = ["claude-agent-sdk>=0.1"]
dev = ["pytest>=7", "pytest-mock>=3.10", "ruff>=0.9", "build>=1"]

[project.scripts]
dtcoder-agentic-dev = "dtcoder_agentic_dev.cli.app:main"
agent-auto-dev = "dtcoder_agentic_dev.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dtcoder_agentic_dev = ["prompts/templates/*.txt", "resources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
