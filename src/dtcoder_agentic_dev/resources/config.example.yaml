# 默认离线。相对配置/模板路径以本文件目录为基准；状态子路径以 state.directory 为基准。
# 认证交由 CLI 登录或环境变量管理，禁止写入认证值或带凭据 URL。
dry_run: false
scheduler:
  poll_interval: 30
  lease_seconds: 120
  heartbeat_interval: 15
  max_nodes_per_tick: 20
agents:
  default_engine: claude-cli # claude-cli / claude-sdk / codex-cli；未知名称明确拒绝
  model_routes: {} # 按模型名称精确路由，例如 {gpt-test: codex-cli}
  max_concurrency: 4
claude:
  binary: claude
  model: '' # 节点 model 优先
  output_format: stream-json # json / stream-json；流式模式可在执行中保存 session
  timeout: 1800
  max_turns: 20
  allowed_tools: [Read, Write, Edit] # 自动许可工具；不是操作系统沙箱或完整工具白名单
  permission_mode: acceptEdits
  sdk_fallback: false # 仅 SDK 导入不可用时可显式回退；执行失败不回退
codex:
  binary: codex
  extra_args: []
  output_format: text
  timeout: 1800
state:
  directory: .
  database: state.db
workspace:
  mirrors: mirrors
  workspaces: workspaces
git:
  binary: git
  timeout: 300
  author_name: DTCoder
  author_email: dtcoder@example.invalid
prompts:
  directory: prompts
code_host:
  adapter: logging # 启用真实托管时设为 antcode
  binary: antcode
  profile: ''
  timeout: 60
  token_env: '' # 保留兼容字段；AntCode 认证通过 CLI 登录完成
pipeline:
  adapter: disabled # 启用真实 CI 时设为 aci
  binary: aci
  timeout: 60
  poll_interval: 30
notification:
  adapter: 'null' # 启用钉钉时设为 dingtalk
  issue_comments: false
  templates_directory: comments
  api_url: '' # HTTPS 卡片网关，或钉钉 createAndDeliver API
  api_mode: gateway # gateway 或 direct，详见 docs/operations.md
  access_token_env: '' # 仅环境变量名；direct 模式必填，令牌值不得写入 YAML
  card_template_id: ''
  timeout: 10
  recipients: assignees # assignees / configured / both
  receiver_ids: []
workflow:
  name: issue-development
  version: '1'
  max_retries: 2
  retry_delay: 1
  max_fix_loops: 3
repositories: []
# 启用真实适配器后可将 repositories 替换为以下列表（替换占位 URL 和项目 ID）：
# repositories:
#   - name: sample
#     provider: antcode
#     project: sample/project
#     remote: https://example.invalid/sample/project.git
#     base_branch: main
#     path: null # 只作为镜像源，不得与受管目录重叠
#     labels: [agent-ready]
#     authors: []
#     reviewers: [] # 平台 ID 或登录名，不能填写展示名称
#     remove_source_branch: false
#     validation_commands:
#       - [python, -m, pytest, -q]
#     validation_timeout: 300
#     pipeline_enabled: true
#     pipeline_failure_blocks: true
#     pipeline:
#       project: '200100125'
#       yml_path: .aci.yml # 与 template_id / yaml_file 恰好选择一种
#       template_id: null
#       yaml_file: null
#       yml_global_path: null
#       branch: null
#       params:
#         env: pre
#       env_file: null
#       source: skill
# 声明式任务：不填 --repo 时使用独立无仓工作区，保持旧 Issue 产品配置兼容。
declarative:
  directory: workflows
  skills_directory: skills
tools:
  allowed_commands: [] # 默认拒绝命令；按受信任参数前缀显式放行，例如 [[python, -m, pytest]]
